<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja — ByteForge Hardware</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <span class="logo">ByteForge Loja</span>
    <nav>
      <button class="tab active" data-tab="vitrine">Vitrine</button>
      <button class="tab logado" data-tab="minha">Minha loja</button>
      <button class="tab logado" data-tab="compras">Minhas compras</button>
      <a class="logado" href="perfil.html"><button class="tab">Perfil</button></a>
      <a class="visitante" href="index.html"><button class="tab">Cadastrar-se</button></a>
      <a class="visitante" href="login.html?destino=loja.html"><button class="tab">Entrar</button></a>
      <button class="tab logado" onclick="sair()">Sair</button>
      <span class="cart-badge" id="cartBadge" title="Itens no carrinho"></span>
    </nav>
  </header>

  <main class="container">

    <!-- ============ VITRINE ============ -->
    <section id="vitrine" class="panel active">
      <div class="toolbar">
        <input type="text" id="busca" placeholder="Buscar produto ou loja..." onkeydown="if(event.key==='Enter')carregarVitrine()">
        <select id="filtroCategoria" onchange="carregarVitrine()"><option value="">Todas as categorias</option></select>
        <select id="filtroLoja" onchange="carregarVitrine()"><option value="">Todas as lojas</option></select>
        <input type="number" id="precoMin" placeholder="Preço mín." min="0" step="0.01" onchange="carregarVitrine()">
        <input type="number" id="precoMax" placeholder="Preço máx." min="0" step="0.01" onchange="carregarVitrine()">
        <select id="ordenar" onchange="carregarVitrine()">
          <option value="">Mais recentes</option>
          <option value="menor_preco">Menor preço</option>
          <option value="maior_preco">Maior preço</option>
        </select>
        <button class="btn small" onclick="carregarVitrine()">Buscar</button>
      </div>
      <div id="paginacao" class="paginacao"></div>

      <div id="carrinhoBox" class="box carrinho" style="display:none">
        <div class="carrinho-head">
          <h3>Carrinho</h3>
          <button class="btn small danger" type="button" onclick="limparCarrinho()">Limpar</button>
        </div>
        <div id="carrinhoItens"></div>
        <div class="carrinho-total">Total: <strong id="carrinhoTotal">R$ 0,00</strong></div>
        <div id="msgCompra" class="msg"></div>
        <button class="btn btn-primary" type="button" onclick="finalizarCompra()">FINALIZAR COMPRA</button>
      </div>

      <div id="listaProdutos" class="grid"></div>
    </section>

    <!-- ============ MINHA LOJA ============ -->
    <section id="minha" class="panel">

      <div id="semLoja" class="box" style="display:none; max-width:520px; margin:0 auto;">
        <h3>Crie sua loja</h3>
        <p class="brand-sub">Você ainda não tem uma loja. Crie uma para começar a vender seus produtos.</p>
        <form onsubmit="criarLoja(event)">
          <div class="form-group">
            <label for="lojaNome">Nome da loja</label>
            <input type="text" id="lojaNome" required maxlength="100" placeholder="Ex: Maria Informática">
          </div>
          <div class="form-group">
            <label for="lojaDesc">Descrição</label>
            <textarea id="lojaDesc" rows="3" maxlength="255" placeholder="O que sua loja vende?"></textarea>
          </div>
          <button class="btn" type="submit">CRIAR LOJA</button>
          <div id="msgLoja" class="msg"></div>
        </form>
      </div>

      <div id="comLoja" style="display:none">
        <div class="box">
          <h3 id="tituloLoja"></h3>
          <p id="descLoja" style="color:var(--muted);font-size:0.9rem"></p>
        </div>

        <div class="box">
          <h3>Adicionar produto</h3>
          <form onsubmit="addProduto(event)">
            <div class="form-group" style="margin-top:0.8rem">
              <label for="pNome">Nome</label>
              <input type="text" id="pNome" required maxlength="120" placeholder="Ex: Placa de vídeo RTX 4060">
            </div>
            <div class="form-group">
              <label for="pDesc">Descrição</label>
              <input type="text" id="pDesc" maxlength="255">
            </div>
            <div class="form-group">
              <label for="pCategoria">Categoria</label>
              <input type="text" id="pCategoria" maxlength="60" placeholder="Ex: Hardware">
            </div>
            <div class="form-group">
              <label for="pImagem">URL da imagem (Google Drive ou outro link público)</label>
              <input type="url" id="pImagem" maxlength="2048" placeholder="https://drive.google.com/file/d/.../view">
            </div>
            <div class="row">
              <div class="form-group">
                <label for="pPreco">Preço (R$)</label>
                <input type="number" id="pPreco" required min="0" step="0.01" placeholder="0,00">
              </div>
              <div class="form-group">
                <label for="pEstoque">Estoque</label>
                <input type="number" id="pEstoque" min="0" step="1" value="1">
              </div>
            </div>
            <button class="btn" type="submit">ADICIONAR PRODUTO</button>
            <div id="msgProd" class="msg"></div>
          </form>
        </div>

        <h3 style="font-family:var(--font-title);color:var(--text);margin-bottom:0.8rem">Meus produtos</h3>
        <div id="meusProdutos" class="grid"></div>
      </div>
    </section>

    <!-- ============ MINHAS COMPRAS ============ -->
    <section id="compras" class="panel">
      <div class="box">
        <h3>Minhas compras</h3>
        <p class="brand-sub">Histórico de pedidos do usuário autenticado.</p>
        <div id="listaCompras"></div>
      </div>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="carrinho.js"></script>
  <script>
    let token = localStorage.getItem('token');
    let produtosVitrine = [];
    let paginaAtual = 1;
    let totalPaginas = 1;

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    const moeda = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    function atualizarAuthUI() {
      document.querySelectorAll('.logado').forEach(el => el.style.display = token ? '' : 'none');
      document.querySelectorAll('.visitante').forEach(el => el.style.display = token ? 'none' : '');
    }

    function exigirLogin() {
      if (token) return true;
      alert('Entre na sua conta para continuar. Seu carrinho foi salvo.');
      window.location.href = 'login.html?destino=' + encodeURIComponent('loja.html');
      return false;
    }

    function sair() {
      localStorage.removeItem('token');
      localStorage.removeItem('nomeUsuario');
      token = null;
      atualizarAuthUI();
      window.location.href = 'loja.html';
    }

    async function api(url, opts = {}) {
      const r = await fetch(API_BASE + url, {
        ...opts,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(opts.headers || {}) }
      });
      if ((r.status === 401 || r.status === 403) && token) { sair(); throw new Error('Sessão expirada'); }
      const dados = await r.json().catch(() => ({}));
      return { ok: r.ok, dados };
    }

    function mostrar(el, texto, tipo) {
      el.textContent = texto;
      el.className = 'msg ' + tipo;
    }

    // ---------- abas ----------
    document.querySelectorAll('.tab[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.tab !== 'vitrine' && !exigirLogin()) return;
        document.querySelectorAll('.tab[data-tab]').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'minha') carregarMinhaLoja();
        else if (btn.dataset.tab === 'compras') carregarCompras();
        else carregarVitrine();
      });
    });

    // ---------- vitrine ----------
    function renderPaginacao() {
      const el = document.getElementById('paginacao');
      if (totalPaginas <= 1) { el.innerHTML = ''; return; }

      let html = '';
      for (let p = 1; p <= totalPaginas; p++) {
        html += `<button class="tab ${p === paginaAtual ? 'active' : ''}" onclick="carregarVitrine(${p})">${p}</button>`;
      }
      el.innerHTML = html;
    }

    async function carregarFiltros() {
      try {
        const [cats, lojas] = await Promise.all([
          fetch(API_BASE + '/categorias').then(r => r.json()),
          fetch(API_BASE + '/lojas').then(r => r.json())
        ]);
        const catSel = document.getElementById('filtroCategoria');
        const lojaSel = document.getElementById('filtroLoja');
        const catAtual = catSel.value;
        const lojaAtual = lojaSel.value;

        catSel.innerHTML = '<option value="">Todas as categorias</option>' +
          cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
        lojaSel.innerHTML = '<option value="">Todas as lojas</option>' +
          lojas.map(l => `<option value="${l.id}">${esc(l.nome)}</option>`).join('');

        catSel.value = catAtual;
        lojaSel.value = lojaAtual;
      } catch (e) {
        /* filtros opcionais: a vitrine continua funcionando */
      }
    }

    async function carregarVitrine(pagina = 1) {
      const params = new URLSearchParams();
      const busca = document.getElementById('busca').value.trim();
      const categoria = document.getElementById('filtroCategoria').value;
      const loja = document.getElementById('filtroLoja').value;
      const precoMin = document.getElementById('precoMin').value;
      const precoMax = document.getElementById('precoMax').value;
      const ordenar = document.getElementById('ordenar').value;

      if (busca) params.set('busca', busca);
      if (categoria) params.set('categoria', categoria);
      if (loja) params.set('loja', loja);
      if (precoMin !== '') params.set('preco_min', precoMin);
      if (precoMax !== '') params.set('preco_max', precoMax);
      if (ordenar) params.set('ordenar', ordenar);
      params.set('pagina', pagina);

      const lista = document.getElementById('listaProdutos');
      try {
        const r = await fetch(API_BASE + '/produtos?' + params.toString());
        const produtos = await r.json();
        produtosVitrine = produtos;
        paginaAtual = Number(r.headers.get('X-Pagina') || pagina);
        totalPaginas = Number(r.headers.get('X-Total-Pages') || 1);

        if (!produtos.length) {
          lista.innerHTML = '<p class="vazio" style="grid-column:1/-1">Nenhum produto encontrado com esses filtros.</p>';
          renderPaginacao();
          return;
        }

        lista.innerHTML = produtos.map(p => `
          <article class="produto">
            <img class="produto-img" src="${API_BASE}${esc(p.imagem)}" alt="${esc(p.nome)}" loading="lazy" onerror="this.onerror=null;this.src=API_BASE+'/sem-imagem.svg'">
            <span class="loja-tag">${esc(p.loja_nome)}</span>
            <h3>${esc(p.nome)}</h3>
            <p class="desc">${esc(p.descricao)}</p>
            <span class="preco">${moeda(p.preco)}</span>
            <span class="estoque">${p.estoque > 0 ? p.estoque + ' em estoque' : 'Esgotado'}</span>
            <div class="comprar">
              <input class="qtd" id="qtd-${p.id}" type="number" min="1" max="${Math.max(1, Number(p.estoque))}" value="1" ${p.estoque > 0 ? '' : 'disabled'}>
              <button class="btn small" type="button" onclick="adicionarCarrinho(${p.id})" ${p.estoque > 0 ? '' : 'disabled'}>Adicionar</button>
            </div>
          </article>`).join('');
        renderPaginacao();
      } catch (e) {
        lista.innerHTML = '<p class="vazio" style="grid-column:1/-1">Erro ao carregar produtos.</p>';
      }
    }

    // ---------- carrinho (LocalStorage) ----------
    function renderCarrinho() {
      const box = document.getElementById('carrinhoBox');
      const itens = document.getElementById('carrinhoItens');
      const totalEl = document.getElementById('carrinhoTotal');
      const badge = document.getElementById('cartBadge');
      const itensCarrinho = Carrinho.todos();

      badge.textContent = Carrinho.quantidadeItens() ? `🛒 ${Carrinho.quantidadeItens()}` : '';

      if (itensCarrinho.length === 0) {
        box.style.display = 'none';
        itens.innerHTML = '';
        totalEl.textContent = moeda(0);
        return;
      }

      itens.innerHTML = itensCarrinho.map(item => {
        const subtotal = Number(item.preco) * item.quantidade;
        return `
          <div class="carrinho-item">
            <img class="carrinho-item-img" src="${API_BASE}/produtos/${item.id}/imagem" alt="${esc(item.nome)}" loading="lazy" onerror="this.onerror=null;this.src=API_BASE+'/sem-imagem.svg'">
            <div class="carrinho-item-info">
              <strong>${esc(item.nome)}</strong>
              <span>${moeda(item.preco)}</span>
            </div>
            <input type="number" min="1" max="${Number(item.estoque)}" value="${item.quantidade}" onchange="atualizarQuantidade(${item.id}, this.value)">
            <span class="preco">${moeda(subtotal)}</span>
            <button class="btn small danger" type="button" onclick="removerCarrinho(${item.id})">Remover</button>
          </div>`;
      }).join('');

      box.style.display = 'block';
      totalEl.textContent = moeda(Carrinho.total());
    }

    function adicionarCarrinho(id) {
      const produto = produtosVitrine.find(p => Number(p.id) === Number(id));
      if (!produto) return;

      const input = document.getElementById('qtd-' + id);
      const quantidade = parseInt(input.value, 10) || 1;
      const resultado = Carrinho.adicionar(produto, quantidade);
      if (resultado.erro) return alert(resultado.erro);

      renderCarrinho();
    }

    function atualizarQuantidade(id, valor) {
      Carrinho.definirQuantidade(id, valor);
      renderCarrinho();
    }

    function removerCarrinho(id) {
      Carrinho.remover(id);
      renderCarrinho();
    }

    function limparCarrinho() {
      Carrinho.limpar();
      renderCarrinho();
    }

    async function finalizarCompra() {
      const msg = document.getElementById('msgCompra');
      if (Carrinho.todos().length === 0) return mostrar(msg, 'Adicione produtos ao carrinho.', 'erro');
      if (!exigirLogin()) return;

      const itens = Carrinho.todos().map(item => ({
        produto_id: item.id,
        quantidade: item.quantidade
      }));

      try {
        const { ok, dados } = await api('/compras', {
          method: 'POST',
          body: JSON.stringify({ itens })
        });

        if (!ok) return mostrar(msg, dados.erro || 'Erro ao finalizar a compra.', 'erro');

        mostrar(msg, 'Compra realizada com sucesso!', 'ok');
        Carrinho.limpar();
        renderCarrinho();
        carregarVitrine();
        carregarCompras();
      } catch (e) {
        mostrar(msg, e.message, 'erro');
      }
    }

    // ---------- minha loja ----------
    async function carregarMinhaLoja() {
      const { dados } = await api('/loja/minha');
      const semLoja = document.getElementById('semLoja');
      const comLoja = document.getElementById('comLoja');

      if (!dados.loja) {
        semLoja.style.display = 'block';
        comLoja.style.display = 'none';
        return;
      }
      semLoja.style.display = 'none';
      comLoja.style.display = 'block';
      document.getElementById('tituloLoja').textContent = dados.loja.nome;
      document.getElementById('descLoja').textContent = dados.loja.descricao || 'Sem descrição.';
      carregarMeusProdutos();
    }

    async function criarLoja(event) {
      event.preventDefault();
      const msg = document.getElementById('msgLoja');
      const { ok, dados } = await api('/loja', {
        method: 'POST',
        body: JSON.stringify({
          nome: document.getElementById('lojaNome').value,
          descricao: document.getElementById('lojaDesc').value
        })
      });
      if (!ok) return mostrar(msg, dados.erro || 'Erro ao criar loja.', 'erro');
      mostrar(msg, 'Loja criada!', 'ok');
      setTimeout(carregarMinhaLoja, 500);
    }

    async function carregarMeusProdutos() {
      const { dados } = await api('/loja/produtos');
      const lista = document.getElementById('meusProdutos');
      if (!dados.length) {
        lista.innerHTML = '<p class="vazio" style="grid-column:1/-1">Você ainda não cadastrou produtos.</p>';
        return;
      }
      lista.innerHTML = dados.map(p => `
        <article class="produto">
          <img class="produto-img" src="${API_BASE}/produtos/${p.id}/imagem" alt="${esc(p.nome)}" loading="lazy" onerror="this.onerror=null;this.src=API_BASE+'/sem-imagem.svg'">
          <h3>${esc(p.nome)}</h3>
          <p class="desc">${esc(p.descricao)}</p>
          <span class="preco">${moeda(p.preco)}</span>
          <span class="estoque">${p.estoque} em estoque</span>
          <button class="btn danger small" type="button" onclick="removerProduto(${Number(p.id)})">Remover</button>
        </article>`).join('');
    }

    async function addProduto(event) {
      event.preventDefault();
      const msg = document.getElementById('msgProd');
      const { ok, dados } = await api('/loja/produtos', {
        method: 'POST',
        body: JSON.stringify({
          nome: document.getElementById('pNome').value,
          descricao: document.getElementById('pDesc').value,
          categoria: document.getElementById('pCategoria').value,
          preco: document.getElementById('pPreco').value,
          estoque: document.getElementById('pEstoque').value,
          imagem_url: document.getElementById('pImagem').value.trim()
        })
      });
      if (!ok) return mostrar(msg, dados.erro || 'Erro ao adicionar.', 'erro');
      mostrar(msg, 'Produto adicionado!', 'ok');
      event.target.reset();
      document.getElementById('pEstoque').value = 1;
      carregarMeusProdutos();
    }

    async function removerProduto(id) {
      if (!confirm('Remover este produto?')) return;
      await api('/loja/produtos/' + id, { method: 'DELETE' });
      carregarMeusProdutos();
    }

    // ---------- minhas compras ----------
    async function carregarCompras() {
      const lista = document.getElementById('listaCompras');
      const { ok, dados } = await api('/compras');

      if (!ok) {
        lista.innerHTML = '<p class="vazio">Erro ao carregar as compras.</p>';
        return;
      }
      if (!dados.length) {
        lista.innerHTML = '<p class="vazio">Você ainda não realizou compras.</p>';
        return;
      }

      lista.innerHTML = dados.map(compra => `
        <div class="compra">
          <div class="compra-head">
            <strong>Compra #${compra.id}</strong>
            <span>${new Date(compra.criado_em).toLocaleString('pt-BR')}</span>
          </div>
          <div class="compra-itens">
            ${compra.itens.map(item => `
              <div class="compra-item">
                <img class="compra-item-img" src="${API_BASE}${esc(item.imagem)}" alt="${esc(item.nome_produto)}" loading="lazy" onerror="this.onerror=null;this.src=API_BASE+'/sem-imagem.svg'">
                <div class="compra-item-info">
                  <strong>${esc(item.nome_produto)}</strong>
                  <span>${item.quantidade}x ${moeda(item.preco_unitario)}</span>
                </div>
                <span class="preco">${moeda(item.subtotal)}</span>
              </div>`).join('')}
          </div>
          <div class="compra-total">Total: <strong>${moeda(compra.total)}</strong></div>
        </div>`).join('');
    }

    atualizarAuthUI();
    renderCarrinho();
    carregarFiltros();
    carregarVitrine();
  </script>
</body>
</html>
